<html lang="en">
<head>
  <meta charset="UTF-8" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --parchment-light: #fdf6e3;
      --parchment-mid: #f3e2be;
      --parchment-dark: #dcc08e;
      --ink-brown: #3b2314;
      --gold-bright: #f59e0b;
      --gold-deep: #b45309;
      --ocean-deep: #0b3954;
      --ocean-mid: #087e8b;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: radial-gradient(circle at 50% 20%, #115e73 0%, #082f49 65%, #041b2d 100%);
      color: var(--ink-brown);
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    .font-pirate {
      font-family: 'Cinzel Decorative', serif;
    }

    .font-display {
      font-family: 'Fredoka', sans-serif;
    }

    /* Parchment Texture & Antique Borders */
    .parchment-card {
      background: linear-gradient(145deg, #fffaf0 0%, #f5e6c8 55%, #ead2a4 100%);
      border: 4px solid #8c5828;
      box-shadow:
        0 14px 30px rgba(0, 0, 0, 0.45),
        inset 0 0 28px rgba(166, 112, 54, 0.25);
      border-radius: 1.25rem;
      position: relative;
    }

    .parchment-inner {
      background: rgba(255, 251, 240, 0.72);
      border: 2px dashed #b07d48;
      border-radius: 1rem;
    }

    .wood-panel {
      background: linear-gradient(180deg, #5c3419 0%, #3d210e 100%);
      border: 3px solid #c98a3c;
      box-shadow: 0 8px 20px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,220,150,0.3);
      color: #fef3c7;
    }

    /* Pirate 3D Tactile Buttons */
    .btn-pirate {
      background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
      border: 3px solid #78350f;
      color: #2d1404;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      letter-spacing: 0.03em;
      box-shadow: 0 5px 0 #78350f, 0 10px 18px rgba(0,0,0,0.35);
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.15s ease;
    }
    .btn-pirate:hover:not(:disabled) {
      filter: brightness(1.06);
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #78350f, 0 14px 22px rgba(0,0,0,0.4);
    }
    .btn-pirate:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #78350f, 0 4px 8px rgba(0,0,0,0.3);
    }
    .btn-pirate:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      filter: grayscale(0.35);
    }

    .btn-emerald {
      background: linear-gradient(180deg, #34d399 0%, #059669 100%);
      border: 3px solid #064e3b;
      color: #ffffff;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      box-shadow: 0 5px 0 #064e3b, 0 10px 18px rgba(0,0,0,0.3);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .btn-emerald:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }
    .btn-emerald:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #064e3b;
    }
    .btn-emerald:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Animations */
    @keyframes floatShip {
      0%, 100% { transform: translateY(0px) rotate(-1.5deg); }
      50% { transform: translateY(-9px) rotate(2deg); }
    }
    @keyframes driftCloud {
      0% { transform: translateX(-12px); }
      50% { transform: translateX(14px); }
      100% { transform: translateX(-12px); }
    }
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.7)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 22px rgba(251, 191, 36, 1)); transform: scale(1.04); }
    }
    @keyframes waveMove {
      0% { transform: translateX(0); }
      50% { transform: translateX(-18px); }
      100% { transform: translateX(0); }
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .anim-ship { animation: floatShip 4.2s ease-in-out infinite; transform-origin: center; }
    .anim-cloud { animation: driftCloud 9s ease-in-out infinite; }
    .anim-glow { animation: pulseGlow 2.6s ease-in-out infinite; }
    .anim-wave { animation: waveMove 5s ease-in-out infinite; }
    .anim-spin-slow { animation: spinSlow 45s linear infinite; }
    .anim-pop { animation: popIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #b45309; border-radius: 999px; }
  </style>
</head>

  <script>
    /* =========================================================================
       1. WEB AUDIO SYNTHESIZER (Pirate Chimes, Page Flips, Fanfare, Error Buzz)
       ========================================================================= */
    const SoundFX = {
      enabled: true,
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playTone(freq, type = 'triangle', duration = 0.2, delay = 0, vol = 0.14) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
          gain.gain.setValueAtTime(0.001, this.ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(vol, this.ctx.currentTime + delay + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + delay);
          osc.stop(this.ctx.currentTime + delay + duration + 0.03);
        } catch (e) {}
      },
      click() { this.playTone(520, 'sine', 0.09, 0, 0.1); },
      pageFlip() {
        this.playTone(340, 'triangle', 0.08, 0, 0.08);
        this.playTone(480, 'triangle', 0.1, 0.05, 0.08);
      },
      success() {
        this.playTone(523.25, 'triangle', 0.18, 0, 0.15);
        this.playTone(659.25, 'triangle', 0.18, 0.12, 0.15);
        this.playTone(783.99, 'triangle', 0.3, 0.24, 0.18);
      },
      error() {
        this.playTone(210, 'sawtooth', 0.22, 0, 0.12);
        this.playTone(175, 'sawtooth', 0.28, 0.16, 0.12);
      },
      fanfare() {
        const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
        const times = [0, 0.13, 0.26, 0.4, 0.62, 0.78];
        notes.forEach((n, i) => this.playTone(n, 'triangle', 0.28, times[i], 0.18));
      }
    };

    function toggleSound() {
      SoundFX.enabled = !SoundFX.enabled;
      document.getElementById('sound-toggle-btn').textContent = SoundFX.enabled ? '🔊' : '🔇';
      if (SoundFX.enabled) SoundFX.click();
      showToast(SoundFX.enabled ? '🔊 Sound Effects ON' : '🔇 Sound Effects Muted');
    }

    function showToast(msg) {
      const box = document.getElementById('toast-box');
      const content = document.getElementById('toast-content');
      content.textContent = msg;
      box.classList.remove('opacity-0', 'translate-y-4');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        box.classList.add('opacity-0', 'translate-y-4');
      }, 2600);
    }

    /* =========================================================================
       3. GAME STATE & LOCALSTORAGE PERSISTENCE
       ========================================================================= */
    const DEFAULT_STATE = {
      screen: 'intro', // 'intro' | 'setup' | 'map' | 'island' | 'final' | 'victory'
      teamName: '',
      players: ['', '', '', ''],
      completedIslands: [], // [1, 2, ...]
      islandScores: {}, // { 1: 200, ... }
      badges: [], // [{ islandId, name, icon }]
      score: 0,
      finalCompleted: false,
      activeIslandId: null,
      // Temporary per-island collaboration state
      openedClues: [false, false, false, false],
      discussionChecks: [false, false, false],
      partADone: false,
      partBDone: false,
      partAAttempts: 0,
      partBAttempts: 0
    };

    let state = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem('reading_quest_state_v1');
        if (saved) {
          return { ...DEFAULT_STATE, ...JSON.parse(saved) };
        }
      } catch (e) {}
      return { ...DEFAULT_STATE };
    }

    function saveState() {
      try {
        localStorage.setItem('reading_quest_state_v1', JSON.stringify(state));
      } catch (e) {}
      updateHUD();
    }

    function resetGame() {
      SoundFX.click();
      localStorage.removeItem('reading_quest_state_v1');
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
      closeModal();
      render();
      showToast('🧭 Quest reset! Ready for a new crew.');
    }

    /* Role rotation logic: rotates clockwise after each completed island */
    function getPlayerForRole(roleIndex, islandId = 1) {
      const rotationOffset = (islandId - 1) % 4;
      const playerIndex = (roleIndex + rotationOffset) % 4;
      return {
        playerIndex,
        playerName: state.players[playerIndex] || `Explorer ${playerIndex + 1}`,
        role: ROLES[roleIndex]
      };
    }

    /* =========================================================================
       4. HUD & MODAL HELPERS
       ========================================================================= */
    function updateHUD() {
      const hud = document.getElementById('game-hud');
      if (state.screen === 'intro' || state.screen === 'setup') {
        hud.classList.add('hidden');
        return;
      }
      hud.classList.remove('hidden');
      document.getElementById('hud-team-name').textContent = state.teamName || 'Sea Explorers';
      const doneCount = state.completedIslands.length;
      document.getElementById('hud-islands-done').textContent = `${doneCount} / 5`;
      document.getElementById('hud-score').textContent = `${state.score} pts`;
      document.getElementById('hud-badges-count').textContent = `${state.badges.length} 🏆`;
      document.getElementById('hud-frag-count').textContent = `${doneCount}/5`;
      document.getElementById('hud-frag-label').textContent = `${doneCount} of 5 Found`;

      const wedgeColors = ['#22c55e', '#f59e0b', '#a855f7', '#0ea5e9', '#f43f5e'];
      for (let i = 1; i <= 5; i++) {
        const el = document.getElementById(`frag-wedge-${i}`);
        if (el) {
          el.setAttribute('fill', state.completedIslands.includes(i) ? wedgeColors[i - 1] : '#334155');
        }
      }
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      box.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    function confirmResetModal() {
      SoundFX.click();
      openModal(`
        <div class="text-center space-y-4">
          <div class="text-5xl">⚠️</div>
          <h3 class="font-pirate text-2xl font-bold text-amber-950">Restart Entire Quest?</h3>
          <p class="text-stone-700 font-semibold">This will clear your team's collected map fragments, badges, and points so a new team can play.</p>
          <div class="flex justify-center gap-3 pt-2">
            <button onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-stone-300 hover:bg-stone-400 font-bold text-stone-900">Keep Playing</button>
            <button onclick="resetGame()" class="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 font-bold text-white shadow-lg">Yes, Reset Quest</button>
          </div>
        </div>
      `);
    }

    function openRosterModal() {
      SoundFX.click();
      const currentIsland = state.activeIslandId || Math.min(state.completedIslands.length + 1, 5);
      const assignments = ROLES.map((r, idx) => {
        const info = getPlayerForRole(idx, currentIsland);
        return `
          <div class="p-3 rounded-xl border-2 ${r.color} flex items-start gap-3">
            <div class="text-3xl">${r.icon}</div>
            <div>
              <div class="text-xs font-extrabold uppercase tracking-wider opacity-80">${r.title}</div>
              <div class="font-display text-lg font-bold">${escapeHTML(info.playerName)}</div>
              <div class="text-xs mt-0.5 leading-snug">${r.duty}</div>
            </div>
          </div>
        `;
      }).join('');

      const badgesHTML = state.badges.length
        ? state.badges.map(b => `<span class="inline-flex items-center gap-1.5 bg-amber-200 border border-amber-500 text-amber-950 px-3 py-1 rounded-full text-xs font-extrabold">${b.icon} ${b.name}</span>`).join('')
        : `<span class="text-xs italic text-stone-600">Complete islands to earn teamwork badges!</span>`;

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between border-b-2 border-amber-700/30 pb-2">
            <h3 class="font-pirate text-xl sm:text-2xl font-bold text-amber-950">Crew Roles (Island ${currentIsland} Rotation)</h3>
            <button onclick="closeModal()" class="text-stone-600 hover:text-stone-950 text-2xl font-bold px-2">&times;</button>
          </div>
          <p class="text-xs sm:text-sm text-stone-700 font-semibold">Roles rotate automatically on every island so every explorer practises reading, hunting clues, thinking, and leading!</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${assignments}</div>
          <div class="parchment-inner p-3">
            <div class="text-xs font-extrabold uppercase text-amber-900 mb-2">Teamwork Badges Earned (${state.badges.length}/5)</div>
            <div class="flex flex-wrap gap-2">${badgesHTML}</div>
          </div>
          <div class="text-right">
            <button onclick="closeModal()" class="btn-pirate px-6 py-2 rounded-xl text-sm">Back to Adventure</button>
          </div>
        </div>
      `);
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    /* =========================================================================
       5. SCREEN RENDERERS
       ========================================================================= */
    function render() {
      updateHUD();
      const container = document.getElementById('screen-container');
      switch (state.screen) {
        case 'intro': renderIntroScreen(container); break;
        case 'setup': renderSetupScreen(container); break;
        case 'map': renderMapScreen(container); break;
        case 'island': renderIslandScreen(container); break;
        case 'final': renderFinalChallengeScreen(container); break;
        case 'victory': renderVictoryScreen(container); break;
        default: renderIntroScreen(container);
      }
    }

    function submitIslandAnswer(part, selectedId) {
      const island = ISLANDS.find(i => i.id === state.activeIslandId) || ISLANDS[0];
      const challenge = part === 'A' ? island.partA : island.partB;

      if (part === 'A') state.partAAttempts++;
      else state.partBAttempts++;

      if (selectedId === challenge.correct) {
        SoundFX.success();
        if (part === 'A') state.partADone = true;
        else state.partBDone = true;

        const attempts = part === 'A' ? state.partAAttempts : state.partBAttempts;
        const earned = attempts === 1 ? 100 : 70;
        if (!state.completedIslands.includes(island.id)) {
          state.score += earned;
        }

        saveState();
        render();

        // Check if BOTH parts are now complete!
        if (state.partADone && state.partBDone) {
          setTimeout(() => completeIslandCelebration(island), 350);
        } else {
          showToast(`✅ Correct! +${earned} pts! Now solve the second challenge.`);
        }
      } else {
        SoundFX.error();
        openModal(`
          <div class="text-center space-y-4">

    /* High-Resolution PNG Certificate Generator */
    function downloadTeamCertificate() {
      SoundFX.fanfare();
      const canvas = document.getElementById('cert-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      // Background parchment gradient
      const grad = ctx.createLinearGradient(0, 0, 1200, 850);
      grad.addColorStop(0, '#fffbeb');
      grad.addColorStop(0.5, '#fef3c7');
      grad.addColorStop(1, '#fde68a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1200, 850);

      // Ornate Double Border
      ctx.strokeStyle = '#78350f';
      ctx.lineWidth = 16;
      ctx.strokeRect(32, 32, 1136, 786);

      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 5;
      ctx.strokeRect(54, 54, 1092, 742);

      // Corner Gold Rosettes
      [[54,54],[1146,54],[54,796],[1146,796]].forEach(([cx, cy]) => {
        ctx.beginPath();
        ctx.arc(cx, cy, 20, 0, Math.PI * 2);
        ctx.fillStyle = '#b45309';
        ctx.fill();
        ctx.strokeStyle = '#fef08a';
        ctx.lineWidth = 3;
        ctx.stroke();
      });

      // Header Text
      ctx.fillStyle = '#92400e';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('YEAR 6 COLLABORATIVE ESL ADVENTURE', 600, 125);

      ctx.fillStyle = '#451a03';
      ctx.font = 'bold 54px Georgia, serif';
      ctx.fillText('CERTIFICATE OF EXPLORATION', 600, 190);

      ctx.fillStyle = '#b45309';
      ctx.font = 'bold 26px Georgia, serif';
      ctx.fillText('READING QUEST: THE LOST TREASURE', 600, 238);

      // Divider
      ctx.beginPath();
      ctx.moveTo(260, 265);
      ctx.lineTo(940, 265);
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Awarded To
      ctx.fillStyle = '#57534e';
      ctx.font = 'italic 24px Georgia, serif';
      ctx.fillText('This award is proudly presented to Crew', 600, 315);

      ctx.fillStyle = '#78350f';
      ctx.font = 'bold 46px Georgia, serif';
      ctx.fillText(state.teamName || 'Sea Explorers', 600, 375);

      // 4 Crew Members Box
      ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.fillRect(160, 405, 880, 95);
      ctx.strokeStyle = '#b45309';
      ctx.lineWidth = 2;
      ctx.strokeRect(160, 405, 880, 95);

      ctx.fillStyle = '#451a03';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText(state.players.join('   •   '), 600, 462);

      // Achievement Summary
      ctx.fillStyle = '#292524';
      ctx.font = '22px sans-serif';
      ctx.fillText('For demonstrating outstanding reading comprehension, vocabulary mastery,', 600, 550);
      ctx.fillText('textual evidence skills, and 4-role collaborative teamwork across all 5 islands.', 600, 584);

      // Score & Badges Pill
      ctx.fillStyle = '#065f46';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText(`Total Quest Score: ${state.score} Points   |   5 of 5 Map Fragments Unlocked`, 600, 645);

      // Footer Date & Seal
      const today = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
      ctx.fillStyle = '#57534e';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`Date Completed: ${today}`, 120, 745);

      ctx.textAlign = 'right';
      ctx.fillText('Signed: Captain Aurelia & Guild of Explorers', 1080, 745);

      // Trigger PNG Download
      try {
        const link = document.createElement('a');
        link.download = `Reading_Quest_Certificate_${(state.teamName || 'Team').replace(/\s+/g, '_')}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('📜 Certificate downloaded!');
      } catch (e) {
        showToast('Certificate generated! Right-click to save if blocked.');
      }
    }

    /* =========================================================================
       6. INITIALIZE ON WINDOW LOAD
       ========================================================================= */
    window.onload = function () {
      render();
    };
  </script>
</body>
</html>
